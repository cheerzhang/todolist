<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <title>My List</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY DAY</p>
        <h1>My List</h1>
        <p class="date" id="date"></p>
      </div>
      <span class="mode" id="mode">Loading</span>
    </header>

    <section class="summary" aria-label="Task overview">
      <div><strong id="leftCount">0</strong><span>tasks left</span></div>
      <div class="progress"><i id="progressBar"></i></div>
      <span id="percent">0%</span>
    </section>

    <div id="sections" class="sections" aria-live="polite"></div>

    <button class="add-section editor-only" id="addSection" type="button" aria-expanded="false" aria-controls="sectionComposer">
      <span class="add-section-icon">＋</span>
      <span><strong>New section</strong><small>Organize different kinds of tasks</small></span>
    </button>
    <form class="section-composer editor-only" id="sectionComposer" hidden>
      <div class="composer-heading">
        <span class="composer-icon">✦</span>
        <div><strong>Create a new section</strong><small>Name this group of tasks</small></div>
      </div>
      <label for="sectionTitle">Section name</label>
      <input id="sectionTitle" name="title" maxlength="30" placeholder="For example: Trip preparation" autocomplete="off">
      <div class="composer-actions">
        <button class="secondary" id="cancelSection" type="button">Cancel</button>
        <button class="primary" type="submit">Create section</button>
      </div>
    </form>
    <div class="device-actions" id="deviceActions" hidden>
      <p id="deviceHint">This public online list is read-only by default.</p>
      <button class="primary" id="enableDeviceEdit" type="button">Edit on this device</button>
      <button id="exportData" type="button" hidden>Export JSON</button>
      <button id="resetDevice" type="button" hidden>Restore online version</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js?v=20260908-1"></script>
</body>
</html>
